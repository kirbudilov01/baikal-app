name: Deploy web app to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Export Expo Web
        run: npm run build:web:pages
        env:
          EXPO_PUBLIC_BASE_URL: /${{ github.event.repository.name }}
          EXPO_PUBLIC_API_BASE_URL: https://baikal.46.17.103.26.sslip.io
          EXPO_PUBLIC_ADMIN_ENABLED: "false"
          EXPO_PUBLIC_PRIVACY_URL: https://baikal.46.17.103.26.sslip.io/privacy
          EXPO_PUBLIC_SUPPORT_URL: https://baikal.46.17.103.26.sslip.io/support
          EXPO_PUBLIC_TERMS_URL: https://baikal.46.17.103.26.sslip.io/terms

      - name: Keep GitHub Pages from processing files with Jekyll
        run: touch dist/.nojekyll

      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
